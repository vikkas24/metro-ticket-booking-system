<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · MetroGo</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="nav" id="nav"></header><div class="card form-card"><h2>Create your account</h2><div id="msg" class="msg"></div>
<form id="authForm" novalidate><label for="name">Full name</label><input id="name" autocomplete="name"><label for="email">Email</label><input id="email" type="email" autocomplete="email">
<label for="phone">Phone (10 digits)</label><input id="phone" inputmode="numeric" maxlength="10"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password">
<label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password"><p><button class="btn" style="width:100%">Register</button></p></form>
<p>Already registered? <a href="login.html">Login</a></p></div>
<script src="js/api.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
