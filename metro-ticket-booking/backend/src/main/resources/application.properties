server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/metro_ticket_booking}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Dev-only admin seeded on first start (override via env vars)
app.admin.email=${ADMIN_EMAIL:admin@metro.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
